name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or operational gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Describe authentication, data exposure, API compatibility or migration effects.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request does not contain credentials or private account data.
          required: true
        - label: This is not a security vulnerability report.
          required: true
